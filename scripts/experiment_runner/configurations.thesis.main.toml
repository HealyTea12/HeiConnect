# See THESIS_EXPERIMENTS.md for the protocol and run budget.
# Provisional defaults: review pilot results and freeze this file before the main run.
# Claim-driven comparisons: representation, reductions, and Supernova baselines.

[synthetic_datasets.cycles]
generator = "cycle"
sizes = [20, 80, 320]
seed_mode = "paired"

[synthetic_datasets.stars]
generator = "star"
sizes = [20, 80, 320]
seed_mode = "paired"

[synthetic_datasets.trees]
generator = "tree"
sizes = [20, 80, 320]
seed_mode = "paired"
seeds = [101, 102, 103, 104, 105]

[synthetic_datasets.variable_cacti]
generator = "cactus_variable"
sizes = [20, 80, 320]
seed_mode = "paired"
seeds = [101, 102, 103, 104, 105]
min_cycle_size = 2
max_cycle_size = 16

[link_configurations.float_uniform_0_1]
distribution = "float_uniform"
float_uniform_lower = 0.0
float_uniform_upper = 1.0
seeds = [201, 202, 203, 204, 205]

[link_configurations.int_uniform_1_5]
distribution = "integer_uniform"
integer_uniform_lower = 1
integer_uniform_upper = 5
seeds = [201, 202, 203, 204, 205]

[configurations.sc_greedy]
algorithm = "Set Cover CSR"
timeout = 60
max_memory_mb = 4096

[configurations.sc_greedy.params]
local_search = false
compute_shortest_paths = false
reduction_type = "csr"
solver = "greedy"
reductions = true
trimming = false

[configurations.sc_no_reductions]
algorithm = "Set Cover CSR"
timeout = 60
max_memory_mb = 4096

[configurations.sc_no_reductions.params]
